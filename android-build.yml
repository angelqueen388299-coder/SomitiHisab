name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Cordova App
        run: |
          npm install -g cordova
          cordova create appcom com.samity.app "TanSamity"
          cd appcom
          cordova platform add android@13.0.0
          rm -rf www/*
          if [ -f "../index.html" ]; then
            cp ../index.html www/
          else
            echo "<h1>App Created</h1>" > www/index.html
          fi
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tan-Samity-APK
          path: appcom/platforms/android/app/build/outputs/apk/debug/app-debug.apk
