name: HTML to Android APK Build

# কখন এই অ্যাকশনটি চলবে তা সেট করা হচ্ছে (যখনই 'main' ব্রাঞ্চে কোড পুশ হবে)
on:
  push:
    branches: [ "main" ]

jobs:
  # 'build' নামের একটি জব তৈরি করা হচ্ছে
  build:
    runs-on: ubuntu-latest # এটি একটি লিনাক্স এনভায়রনমেন্টে চলবে

    steps:
      # ১. কোড চেকআউট করা
      - name: Checkout Code
        uses: actions/checkout@v3

      # ২. নোড.জেএস (Node.js) সেটআপ করা (PWA বুিল্ডার টুলের জন্য প্রয়োজন)
      - name: Setup Node.js
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17' # অ্যান্ড্রয়েড বিল্ডের জন্য জাভা ১৭ প্রয়োজন

      # ৩. PWABuilder cli টুল ইনস্টল করা
      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      # ৪. PWA থেকে Android Project তৈরি করা
      # (আপনার HTML ফাইলের নাম যদি index.html না হয়, তবে নিচে পরিবর্তন করুন)
      - name: Build Android Project
        run: pwabuilder package --platform android --packageId com.somiti.hisab --appName "SomitiHisab" --appVersion 1.0.0 --url "file://${{ github.workspace }}/index.html" --output android_project

      # ৫. অ্যান্ড্রয়েড প্রোজেক্ট বিল্ড করা (APK তৈরি)
      - name: Build APK using Gradle
        run: |
          cd android_project
          chmod +x gradlew
          ./gradlew assembleDebug

      # ৬. তৈরি হওয়া APK ফাইলটি অ্যাকশনে আপলোড করা (যাতে আপনি ডাউনলোড করতে পারেন)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: somiti-hisab-apk # ডাউনলোডের সময় এই নামে ফাইলটি পাবেন
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
